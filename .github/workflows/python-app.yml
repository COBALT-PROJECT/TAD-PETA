name: Python application tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
          if [ -f PETA/requirements.txt ]; then pip install -r PETA/requirements.txt; fi
      - name: Test PETA modules
        run: |
          PYTHONPATH=$PYTHONPATH:$(pwd)/PETA pytest PETA/tests/ -v
      - name: Test TAD modules
        run: |
          PYTHONPATH=$PYTHONPATH:$(pwd)/TAD/scripts pytest TAD/tests/ -v
